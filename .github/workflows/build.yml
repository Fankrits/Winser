name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.configuration }} x64)
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # WinUI 3 needs the MRT/PRI build tasks, which ship with Visual Studio's MSBuild
      # rather than the .NET SDK, so `dotnet build` cannot produce resources.pri on its own.
      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: >
          msbuild Winser.sln
          -t:Restore
          -p:Configuration=${{ matrix.configuration }}
          -p:Platform=x64
          -m

      - name: Build
        run: >
          msbuild Winser.sln
          -p:Configuration=${{ matrix.configuration }}
          -p:Platform=x64
          -m

  # Informational only: checks whether EnableMsixTooling unblocks `dotnet build` directly
  # (see the property's comment in Winser.csproj). continue-on-error keeps a "no" here from
  # failing the workflow - the msbuild job above is the one that gates CI either way.
  probe-dotnet-build:
    name: Probe - does dotnet build work now?
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet build Winser.sln -c Release -p:Platform=x64
