name: release

# Separate from build.yml on purpose: build.yml verifies every push compiles, cheaply and
# often. This packages a signed, installable .msix, which needs secrets and only makes sense
# as a deliberate act - pushing a version tag, or a manual run to test the pipeline before
# committing to a real tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package MSIX (Release x64)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: microsoft/setup-msbuild@v2

      - name: Determine release tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-$env:GITHUB_RUN_NUMBER" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      # MSIX identity comparisons are purely by-the-numbers (Name+Publisher+Architecture match,
      # Version compared field by field) - Package.appxmanifest's Version was previously left at
      # its committed 1.0.0.0 for every build, so every release had an identical package identity
      # with different contents inside, which Add-AppxPackage refuses to install or upgrade
      # (0x80073cfb: "same identity ... but the contents are different"). Deriving the identity
      # version from the release tag instead means each release is a real, monotonically higher
      # version Windows will actually upgrade in place. A non-tag (workflow_dispatch) run has no
      # semver to parse, so it gets a build-only version instead - it's never installed for real,
      # only uploaded as a workflow artifact, so it doesn't need to be a valid upgrade target.
      - name: Compute the package identity version
        shell: pwsh
        run: |
          $pkgVersion = if ("${{ github.ref_type }}" -eq "tag") {
            $parts = @(("${{ github.ref_name }}" -replace '^v') -split '\.')
            while ($parts.Count -lt 4) { $parts += '0' }
            $parts[0..3] -join '.'
          } else {
            "0.0.0.$env:GITHUB_RUN_NUMBER"
          }
          "PACKAGE_VERSION=$pkgVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set the package identity version in Package.appxmanifest
        shell: pwsh
        run: |
          $manifestPath = "src/Winser/Package.appxmanifest"
          $original = Get-Content $manifestPath -Raw
          $updated = $original -replace '(<Identity\s[\s\S]*?)Version="[\d.]+"', "`$1Version=`"$env:PACKAGE_VERSION`""
          if ($updated -eq $original) {
            Write-Error "Did not find an <Identity ... Version=`"...`"/> attribute to patch in $manifestPath."
            exit 1
          }
          Set-Content -Path $manifestPath -Value $updated -NoNewline
          Write-Host "Package identity version set to $env:PACKAGE_VERSION"

      # Package.appxmanifest's Publisher (CN=Fankrits) must match this certificate's Subject
      # byte for byte, or signing fails. See README for the exact commands to generate one.
      - name: Check the signing certificate secrets are configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty("${{ secrets.WINSER_PFX_BASE64 }}") -or [string]::IsNullOrEmpty("${{ secrets.WINSER_PFX_PASSWORD }}")) {
            Write-Error "WINSER_PFX_BASE64 and/or WINSER_PFX_PASSWORD repo secrets are not set - see README.md#creating-a-release for how to generate and add them."
            exit 1
          }

      # RID-scoped builds need the obj folder populated with RuntimeIdentifiers before Build,
      # same reason build.yml's msbuild jobs restore as a separate step.
      - name: Restore
        run: >
          msbuild Winser.sln
          -t:Restore
          -p:Configuration=Release
          -p:Platform=x64
          -m

      - name: Decode the signing certificate
        shell: pwsh
        run: |
          $bytes = [System.Convert]::FromBase64String("${{ secrets.WINSER_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ runner.temp }}\WinserSigning.pfx", $bytes)

      # WindowsPackageType=MSIX overrides Winser.csproj's own WindowsPackageType=None for this
      # build only - every other build (the IDE, dotnet build/publish, all of build.yml) never
      # passes this and stays unpackaged. GenerateAppxPackageOnBuild is what actually produces
      # the .msix; without it this would just be an ordinary (packaged-but-unpublished) build.
      - name: Build and package the MSIX
        run: >
          msbuild Winser.sln
          -p:Configuration=Release
          -p:Platform=x64
          -p:WindowsPackageType=MSIX
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxBundle=Never
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:AppxPackageDir=Packages\
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateKeyFile=${{ runner.temp }}\WinserSigning.pfx
          -p:PackageCertificatePassword=${{ secrets.WINSER_PFX_PASSWORD }}
          -p:AppxPackageSigningTimestampServerUrl=http://timestamp.digicert.com
          -p:AppxPackageSigningTimestampDigestAlgorithm=SHA256
          -m

      - name: Remove the signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -Path "${{ runner.temp }}\WinserSigning.pfx" -ErrorAction SilentlyContinue

      # Fails loudly rather than letting a wrong-glob assumption silently upload nothing or
      # the wrong file - the same "let CI answer, don't guess" rule this repo's build.yml
      # comments already apply to EnableMsixTooling.
      - name: Locate the packaged MSIX
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path src/Winser/Packages -Recurse -Filter *.msix -ErrorAction SilentlyContinue
          if (-not $msix) {
            Write-Error "No .msix found under src/Winser/Packages - packaging did not produce the expected output."
            exit 1
          }
          if ($msix.Count -gt 1) {
            Write-Error "Expected exactly one .msix, found $($msix.Count): $($msix.FullName -join ', ')"
            exit 1
          }

          $dest = "Winser-$env:RELEASE_TAG-x64.msix"
          Copy-Item $msix.FullName $dest
          "MSIX_PATH=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Packaged $dest ($([math]::Round($msix.Length / 1MB, 1)) MB)"

      # Reads the certificate straight back out of the .msix that was just signed, rather than
      # re-opening the .pfx with the password again - the exported .cer is then guaranteed to
      # be exactly the certificate that actually signed this file, not a second copy that could
      # in principle drift from it. This .cer (public key only, no private key - safe to publish
      # openly, unlike the .pfx) is what install-winser.ps1 imports to LocalMachine\TrustedPeople
      # on whatever device it's run on.
      #
      # Checking for SignerCertificate rather than a specific $sig.Status: this runner has no
      # more reason to trust a self-signed cert than any other machine does, so status is
      # expected to read as something other than Valid here regardless of whether signing
      # actually succeeded - the certificate being present is what actually answers that.
      - name: Export the public certificate for distribution
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "${{ env.MSIX_PATH }}"
          if (-not $sig.SignerCertificate) {
            Write-Error "Get-AuthenticodeSignature found no certificate on ${{ env.MSIX_PATH }} (status: $($sig.Status)) - packaging may not have signed it."
            exit 1
          }

          $certPath = "Winser-$env:RELEASE_TAG.cer"
          Export-Certificate -Cert $sig.SignerCertificate -FilePath $certPath | Out-Null
          "CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Exported $certPath (Subject: $($sig.SignerCertificate.Subject))"

      # Three explicit paths rather than a glob: PowerShell doesn't expand wildcards in an
      # external command's arguments the way bash does, so gh would receive the literal
      # asterisk instead of the files it matches. Every path here is already known exactly,
      # so there is nothing a glob would add anyway.
      - uses: actions/upload-artifact@v4
        with:
          name: Winser-${{ env.RELEASE_TAG }}-x64-msix
          path: |
            ${{ env.MSIX_PATH }}
            ${{ env.CERT_PATH }}
            packaging/install-winser.ps1

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ github.ref_name }}
          "${{ env.MSIX_PATH }}"
          "${{ env.CERT_PATH }}"
          packaging/install-winser.ps1
          --title "${{ github.ref_name }}"
          --notes "Self-signed MSIX. Download all three files (.msix, .cer, install-winser.ps1) into the same folder, then right-click install-winser.ps1 -> Run with PowerShell as Administrator - it trusts the certificate and installs the package in one step. See README.md#installing-a-release for the manual commands if you'd rather not run a script."
