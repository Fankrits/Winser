name: diagnose

# Drives a real Winser instance on a real Windows session - GitHub's windows-latest runners
# are interactive, with Edge/WebView2 preinstalled (confirmed against actions/runner-images'
# own manifest), not the headless Session-0-only boxes "windows-latest" is sometimes assumed to
# mean. Every
# key combination is read out of BrowserViewModel.HandleShortcut, not guessed. Produces the
# numbers in README.md's Memory section and the screenshots referenced there. Diagnostic, not
# a gate: not wired into build.yml or release.yml, and safe to re-run whenever a change in this
# area (freeze, discard, the idle sweep) needs the same kind of answer again.
on:
  push:
    branches: ["claude/windows-browser-winui3-rt6irp"]
  workflow_dispatch:

jobs:
  diagnose:
    name: Empirical check (memory, Mica, shortcuts)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: >
          dotnet publish src/Winser/Winser.csproj
          -c Release
          -p:Platform=x64
          -r win-x64
          -o publish

      - name: Seed a short discard threshold
        shell: pwsh
        run: |
          # 1 minute instead of the 30-minute default, purely so this job finishes in CI time.
          # JsonStore.Load() reads this file directly if present - confirmed in
          # Services/JsonStore.cs and Services/SettingsService.cs - so a partial document with
          # just this one field is enough; everything else keeps its normal C# default.
          $dataDir = Join-Path $env:LOCALAPPDATA 'Winser\Data'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          '{"discardIdleTabsAfterMinutes": 1, "startup": 0}' |
            Out-File -Encoding utf8 (Join-Path $dataDir 'settings.json')
          # startup:0 = StartupBehavior.NewTabPage, so a fresh run never tries to restore a
          # session that doesn't exist yet.

      - name: Drive Winser and record what actually happens
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing

          # WScript.Shell.AppActivate wraps SetForegroundWindow, which Windows' focus-stealing
          # prevention can silently refuse for a window owned by a process this script only
          # just started - AppActivate has no way to report that refusal, so SendKeys can send
          # into nothing without any error. AllowSetForegroundWindow (called once, right after
          # Start-Process) is the documented way to grant that process permission to take focus;
          # calling SetForegroundWindow directly afterwards, rather than through the COM
          # wrapper, means a failure to activate at least surfaces as a warning.
          #
          # One line rather than a here-string: PowerShell 7 requires a here-string's closing
          # "@ at column 1 with no leading whitespace, which a YAML block scalar can't provide
          # without ending the block early.
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class Win32 { [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd); [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow); [DllImport("user32.dll")] public static extern bool AllowSetForegroundWindow(int dwProcessId); }'
          $shots = New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\diagnostics"

          # Winser's own working set is measured alongside the renderers', because the two move
          # for different reasons and only one of them was ever visible here. Chromium's is what
          # freeze and discard act on; Winser's is what the XAML shell costs, which is what any
          # change to how much chrome is built per tab actually moves. Reporting only the first
          # made the second unfalsifiable.
          function Measure-Footprint {
              $web   = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue)
              $shell = @(Get-Process Winser -ErrorAction SilentlyContinue)
              [pscustomobject]@{
                  MB      = if ($web)   { [math]::Round((($web   | Measure-Object WorkingSet64 -Sum).Sum) / 1MB, 1) } else { 0 }
                  Count   = $web.Count
                  ShellMB = if ($shell) { [math]::Round((($shell | Measure-Object WorkingSet64 -Sum).Sum) / 1MB, 1) } else { 0 }
              }
          }

          # Total CPU time consumed, summed across the shell and every renderer. Sampled as a
          # difference over a fixed wall-clock window rather than as an instantaneous
          # percentage, which on a shared runner is mostly noise.
          function Measure-CpuSeconds {
              $total = 0.0
              foreach ($p in @(Get-Process Winser, msedgewebview2 -ErrorAction SilentlyContinue)) {
                  try { $total += $p.TotalProcessorTime.TotalSeconds } catch { }
              }
              [math]::Round($total, 3)
          }

          function Send-Key($keys) {
              $proc.Refresh()
              $hwnd = $proc.MainWindowHandle
              if ($hwnd -eq [IntPtr]::Zero) {
                  Write-Warning "MainWindowHandle is zero - Send-Key '$keys' has no window to target"
              } else {
                  [Win32]::ShowWindow($hwnd, 9) | Out-Null   # SW_RESTORE, in case it's minimized
                  $activated = [Win32]::SetForegroundWindow($hwnd)
                  if (-not $activated) {
                      Write-Warning "SetForegroundWindow returned false for Send-Key '$keys'"
                  }
              }
              Start-Sleep -Milliseconds 400
              [System.Windows.Forms.SendKeys]::SendWait($keys)
          }

          function Save-Shot($name) {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $path = Join-Path $shots.FullName "$name.png"
              $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose()
              Write-Host "Saved $path"
          }

          $results = [ordered]@{}

          Write-Host "Launching Winser..."
          $launch = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath "publish\Winser.exe" -ArgumentList "https://example.com" -PassThru
          [Win32]::AllowSetForegroundWindow($proc.Id) | Out-Null

          # Polled rather than slept: the number wanted is how long the window actually took to
          # appear, and a fixed sleep can only ever confirm it was under the sleep.
          $windowMs = $null
          while ($launch.Elapsed.TotalSeconds -lt 30) {
              if ($proc.HasExited) { break }
              $proc.Refresh()
              if ($proc.MainWindowHandle -ne [IntPtr]::Zero) {
                  $windowMs = [math]::Round($launch.Elapsed.TotalMilliseconds)
                  break
              }
              Start-Sleep -Milliseconds 25
          }

          if ($proc.HasExited) {
              Write-Error "Winser.exe exited immediately (code $($proc.ExitCode)) - nothing else to measure."
              exit 1
          }

          if ($null -eq $windowMs) {
              Write-Warning "No main window within 30s - startup timing unavailable."
          } else {
              Write-Host "First window after $windowMs ms"
          }

          # Still settle before touching anything: a window handle is not a loaded page.
          Start-Sleep -Seconds 8
          $proc.Refresh()
          Write-Host "MainWindowHandle after startup: $($proc.MainWindowHandle)"
          Save-Shot "01-first-launch"

          Write-Host "Opening nine more tabs..."
          for ($i = 0; $i -lt 9; $i++) {
              Send-Key "^t"
              Start-Sleep -Milliseconds 500
              Send-Key "^l"
              Start-Sleep -Milliseconds 300
              Send-Key "https://example.com"
              Send-Key "{ENTER}"
              Start-Sleep -Seconds 2
          }
          Start-Sleep -Seconds 8
          Save-Shot "02-ten-tabs-open"
          $results.Baseline10Tabs = Measure-Footprint
          Write-Host ("Baseline: {0} MB across {1} processes" -f $results.Baseline10Tabs.MB, $results.Baseline10Tabs.Count)

          Write-Host "Exercising find, zoom and full screen on the active tab..."
          Send-Key "^f"
          Start-Sleep -Seconds 1
          Save-Shot "03-find-bar"
          Send-Key "{ESC}"
          Send-Key "^{+}"
          Send-Key "^{+}"
          Start-Sleep -Milliseconds 500
          Save-Shot "04-zoomed-in"
          Send-Key "^0"
          Send-Key "{F11}"
          Start-Sleep -Seconds 1
          Save-Shot "05-fullscreen"
          Send-Key "{F11}"
          Start-Sleep -Milliseconds 500

          Write-Host "Switching to tab 1 so the other nine background and freeze..."
          Send-Key "^1"
          Start-Sleep -Seconds 15
          $results.AfterFreeze = Measure-Footprint
          Write-Host ("After freeze: {0} MB across {1} processes" -f $results.AfterFreeze.MB, $results.AfterFreeze.Count)

          # The sweep is no longer a once-a-minute poll that this has to out-wait: it arms a
          # single shot for the moment the first tab is actually due (BrowserViewModel.
          # RescheduleIdleSweep), so with a 1-minute threshold the discard happens about a
          # minute after the tabs were backgrounded. 150s is kept anyway - it is generous rather
          # than load-bearing now, and holding the number steady keeps runs before and after
          # this change comparable.
          Write-Host "Waiting 150s for the 1-minute discard threshold..."
          Start-Sleep -Seconds 150
          $results.AfterDiscard = Measure-Footprint
          Write-Host ("After discard: {0} MB across {1} processes" -f $results.AfterDiscard.MB, $results.AfterDiscard.Count)

          # ---- idle CPU ----
          # Nine tabs discarded, one showing a static page, nobody touching anything: the state
          # a browser spends most of its life in, and the one the deadline sweep, the cursor
          # poll backoff and the throttling flag all exist to make cheaper. Nothing measured
          # here before, so none of that was falsifiable.
          Write-Host "Sampling idle CPU over 60s..."
          $cpuBefore = Measure-CpuSeconds
          Start-Sleep -Seconds 60
          $idleCpuSeconds = [math]::Round((Measure-CpuSeconds) - $cpuBefore, 3)
          Write-Host ("Idle CPU: {0}s of CPU time across all processes over 60s wall clock" -f $idleCpuSeconds)

          Write-Host "Returning to a discarded tab..."
          Send-Key "^2"
          Start-Sleep -Seconds 5
          Save-Shot "06-returned-to-discarded-tab"
          $results.AfterReturn = Measure-Footprint

          # The log dump goes first and the results last, deliberately: this job exists to
          # produce those numbers, and printed before a few hundred lines of layout tracing they
          # were the one thing a tail of the run never showed.
          #
          # DiagnosticLog.Write is an immediate, unbuffered append (File.AppendAllText per
          # call - see Services/DiagnosticLog.cs), so this is current as of the moment it's
          # read, no flush-timing race to worry about.
          $logPath = Join-Path $env:LOCALAPPDATA 'Winser\Data\diagnostics.log'
          if (Test-Path $logPath) {
              Write-Host "`n=== diagnostics.log ==="
              Get-Content $logPath | Write-Host
              "## diagnostics.log" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
              Get-Content $logPath | Out-File -Append $env:GITHUB_STEP_SUMMARY
              "``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          } else {
              Write-Warning "No diagnostics.log found at $logPath"
          }

          $summary = @()
          $summary += "## Empirical check results"
          $summary += ""
          $summary += "| Checkpoint | WebView2 MB | msedgewebview2 processes | Winser MB |"
          $summary += "|---|---:|---:|---:|"
          foreach ($key in $results.Keys) {
              $summary += "| $key | {0:N1} | {1} | {2:N1} |" -f $results[$key].MB, $results[$key].Count, $results[$key].ShellMB
          }
          $summary += ""
          $summary += "| Measure | Value |"
          $summary += "|---|---:|"
          $summary += "| First window after launch | {0} |" -f $(if ($null -eq $windowMs) { "not observed" } else { "$windowMs ms" })
          $summary += "| CPU seconds over a 60s idle window | {0:N3} |" -f $idleCpuSeconds
          $summary += ""
          $summary += "Screenshots are attached as the diagnostics-screenshots artifact."
          $summary | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $summary | Out-String | Write-Host

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Name msedgewebview2 -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-screenshots
          path: diagnostics/*.png
