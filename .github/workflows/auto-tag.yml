name: auto-tag

# Every merge to main gets its own release, so shipping is "merge the PR" - no separate manual
# tagging step. Version bumps follow Conventional Commits, read from commit subjects/bodies since
# the last v* tag: BREAKING CHANGE (or a `!` before the colon) bumps major, `feat:` bumps minor,
# everything else - including commits that don't follow the convention - bumps patch, so a merge
# always produces a new release rather than silently no-op'ing.
#
# The new tag is pushed with the default GITHUB_TOKEN, and GitHub deliberately does not let a
# push made with that token trigger other workflows (its own loop protection) - so release.yml's
# `push: tags: ["v*"]` trigger would never fire on its own here. Instead this workflow dispatches
# release.yml directly against the new tag, which gives that run github.ref_type == 'tag' exactly
# as a real tag push would, so its release-creation step still runs.
on:
  push:
    branches: [Main]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push the next version tag
        id: tag
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force

          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)

          if [ -z "$LAST_TAG" ]; then
            RANGE=""
            BASE="0.0.0"
          else
            RANGE="$LAST_TAG..HEAD"
            BASE="${LAST_TAG#v}"
          fi

          # Guard against a re-run (or a workflow re-dispatch) tagging the same commit twice.
          if [ -n "$LAST_TAG" ] && [ "$(git rev-list -n1 "$LAST_TAG")" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD is already tagged as $LAST_TAG - nothing to release."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOG=$(git log $RANGE --pretty=format:'%s')
          BODY=$(git log $RANGE --pretty=format:'%B')

          BUMP="patch"
          if echo "$LOG" | grep -Eq '^[a-zA-Z]+(\([^)]*\))?!:' || echo "$BODY" | grep -q 'BREAKING CHANGE'; then
            BUMP="major"
          elif echo "$LOG" | grep -Eq '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping ${LAST_TAG:-<no previous tag>} -> $NEW_TAG ($BUMP)"

          git tag -a "$NEW_TAG" -m "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Trigger the release workflow for the new tag
        if: steps.tag.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "${{ steps.tag.outputs.tag }}"
