name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.configuration }} x64)
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # WinUI 3's MRT/PRI build tasks normally ship with Visual Studio's MSBuild rather than
      # the .NET SDK. EnableMsixTooling (in Winser.csproj) routes around that for plain
      # `dotnet build` too - see dotnet-build below - but msbuild stays the primary, most-tested
      # path, matching what Visual Studio itself uses.
      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: >
          msbuild Winser.sln
          -t:Restore
          -p:Configuration=${{ matrix.configuration }}
          -p:Platform=x64
          -m

      - name: Build
        run: >
          msbuild Winser.sln
          -p:Configuration=${{ matrix.configuration }}
          -p:Platform=x64
          -m

  # Confirms the plain `dotnet build` / `dotnet run` path from the README keeps working.
  # EnableMsixTooling (in Winser.csproj) is what unblocks it; this gates on that staying true
  # rather than just hoping a future dependency bump doesn't quietly break it again.
  dotnet-build:
    name: Build (dotnet CLI, Release x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet build Winser.sln -c Release -p:Platform=x64
