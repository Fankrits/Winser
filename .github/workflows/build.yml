name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.configuration }} x64)
    runs-on: windows-latest
    # Every job here normally finishes in a few minutes. Without an explicit cap, a wedged
    # runner falls back to GitHub's 360-minute default before anyone finds out - which is what
    # happened to dotnet-build once already (hung ~45 minutes, then failed, on a commit whose
    # diff didn't touch anything this job's path runs through). A tight timeout turns that into
    # a fast, visible failure instead of a silent multi-hour hold.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # WinUI 3's MRT/PRI build tasks normally ship with Visual Studio's MSBuild rather than
      # the .NET SDK. EnableMsixTooling (in Winser.csproj) routes around that for plain
      # `dotnet build` too - see dotnet-build below - but msbuild stays the primary, most-tested
      # path, matching what Visual Studio itself uses.
      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: >
          msbuild Winser.sln
          -t:Restore
          -p:Configuration=${{ matrix.configuration }}
          -p:Platform=x64
          -m

      - name: Build
        run: >
          msbuild Winser.sln
          -p:Configuration=${{ matrix.configuration }}
          -p:Platform=x64
          -m

  # Confirms the plain `dotnet build` / `dotnet run` path from the README keeps working.
  # EnableMsixTooling (in Winser.csproj) is what unblocks it; this gates on that staying true
  # rather than just hoping a future dependency bump doesn't quietly break it again.
  dotnet-build:
    name: Build (dotnet CLI, Release x64)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet build Winser.sln -c Release -p:Platform=x64

  # Winser ships self-contained, which means its own copy of .NET *and* of the Windows App
  # SDK. That is a deliberate trade - no runtime prerequisites for the user - but it is also
  # the entire deployment size, so it gets measured on every push instead of estimated.
  size:
    name: Publish size (Release x64)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (self-contained, as shipped)
        run: >
          dotnet publish src/Winser/Winser.csproj
          -c Release
          -p:Platform=x64
          -r win-x64
          -o publish/self-contained

      # The documented alternative: same app, but leaning on a .NET 10 Desktop Runtime and a
      # Windows App SDK runtime already installed on the machine. Measured next to the shipped
      # shape so the README can quote what that trade actually buys rather than guessing.
      - name: Publish (framework-dependent)
        run: >
          dotnet publish src/Winser/Winser.csproj
          -c Release
          -p:Platform=x64
          -r win-x64
          -p:SelfContained=false
          -p:WindowsAppSDKSelfContained=false
          -o publish/framework-dependent

      # The lean shape has no other distribution path - release.yml only ships the
      # self-contained MSIX - so this is the one place anyone who can meet its two runtime
      # prerequisites (the .NET 10 Desktop Runtime and Windows App SDK runtime) can get it.
      - name: Upload framework-dependent build
        uses: actions/upload-artifact@v4
        with:
          name: Winser-framework-dependent-x64
          path: publish/framework-dependent

      - name: Report
        shell: pwsh
        run: |
          function Measure-Publish($path) {
            $files = Get-ChildItem $path -Recurse -File
            [pscustomobject]@{
              Files = $files
              Count = $files.Count
              MB    = ($files | Measure-Object Length -Sum).Sum / 1MB
            }
          }

          $shipped = Measure-Publish publish/self-contained
          $lean    = Measure-Publish publish/framework-dependent

          $report = @()
          $report += "## Publish size"
          $report += ""
          $report += "| Shape | MB | Files |"
          $report += "|---|---:|---:|"
          $report += "| Self-contained (as shipped) | {0:N1} | {1:N0} |" -f $shipped.MB, $shipped.Count
          $report += "| Framework-dependent | {0:N1} | {1:N0} |" -f $lean.MB, $lean.Count
          $report += ""
          $report += "### 25 largest, as shipped"
          $report += ""
          $report += "| File | MB |"
          $report += "|---|---:|"
          $report += $shipped.Files | Sort-Object Length -Descending | Select-Object -First 25 |
            ForEach-Object { "| {0} | {1:N1} |" -f $_.Name, ($_.Length / 1MB) }

          $report | Out-File -Append $env:GITHUB_STEP_SUMMARY

          # Same numbers in the log, so they are readable without opening the summary.
          "SELF-CONTAINED:      {0,7:N1} MB across {1,4:N0} files" -f $shipped.MB, $shipped.Count
          "FRAMEWORK-DEPENDENT: {0,7:N1} MB across {1,4:N0} files" -f $lean.MB, $lean.Count
          $shipped.Files | Sort-Object Length -Descending | Select-Object -First 25 |
            Format-Table @{ n = "MB"; e = { "{0:N1}" -f ($_.Length / 1MB) } }, Name |
            Out-String -Width 200
